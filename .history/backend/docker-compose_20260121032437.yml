version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: sunuid-postgres
    environment:
      POSTGRES_USER: sunuid
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sunuid_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: sunuid-backend
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://sunuid:secret@172.17.0.1:5433/sunuid_db
    depends_on:
      - postgres

volumes:
  postgres_data:
